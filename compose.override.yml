# Development overrides (applied automatically by `docker compose up`).
# Host ports: 8800 backend API, 5173 frontend (Vite), 5432 Postgres, 6333/6334 Qdrant,
# 9000/9001 MinIO, 8801 Adminer.
# 8000-8010 and 8080 are left free for the vMLX gateway and its model backends.
services:

  db:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  adminer:
    ports:
      - "8801:8080"

  backend:
    ports:
      - "8800:8000"
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
            - htmlcov
        - path: ./backend/pyproject.toml
          action: rebuild
    environment:
      FASTAPI_ENV: "development"

  worker:
    command: ["python", "-m", "app.worker"]
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - .venv
            - htmlcov
        - path: ./backend/pyproject.toml
          action: rebuild
    environment:
      FASTAPI_ENV: "development"

  frontend:
    image: oven/bun:1
    working_dir: /app/frontend
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8800
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
      - frontend-app-node-modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  frontend-node-modules:
  frontend-app-node-modules:
