# Production deployment: one prebuilt image serves the API, the built web app and
# the background worker. Models are not run here - they come from any
# OpenAI-compatible provider over HTTPS.
#
#   docker compose -f compose.deploy.yml up -d
#
# Every secret comes from the environment (a `.env` beside this file, or real env
# vars). Nothing credential-shaped is baked into the image.

x-backend-common: &backend-common
  image: ${KB_IMAGE:-shanaka95/knowledge-base:latest}
  restart: unless-stopped
  environment: &backend-env
    PROJECT_NAME: ${PROJECT_NAME:-PlusGPT}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    FIRST_SUPERUSER: ${FIRST_SUPERUSER:?set FIRST_SUPERUSER}
    FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?set FIRST_SUPERUSER_PASSWORD}
    # Also where the links inside emails point, so it has to be the public
    # address rather than a placeholder.
    FRONTEND_HOST: ${FRONTEND_HOST:?set FRONTEND_HOST}
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/app
    QDRANT_URL: http://qdrant:6333
    # Qdrant answers anyone who can reach it, and on one host that means
    # anything else on this network. Authenticate it.
    QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_documents}
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    MINIO_BUCKET: ${MINIO_BUCKET:-kb-attachments}
    MINIO_SECURE: "false"

    # --- product identity -----------------------------------------------------
    APP_NAME: ${APP_NAME:-PlusGPT}
    APP_TAGLINE: ${APP_TAGLINE:-a personal knowledge management system}

    # --- email (AWS SES) ------------------------------------------------------
    # Registration, sign-in codes and password resets all depend on this. With
    # EMAIL_ENABLED=false nothing is sent and codes go to the log, which is fine
    # for a private instance and useless for a public one.
    EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    EMAIL_FROM: ${EMAIL_FROM:-noreply@plusgpt.io}
    EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-PlusGPT}
    AWS_REGION: ${AWS_REGION:-eu-west-1}
    AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
    AWS_ACCESS_SECRET: ${AWS_ACCESS_SECRET:-}

    # --- models: one provider, one key, set on the host -----------------------
    LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL}
    LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
    LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
    LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
    # How much document goes to the chat model in one call. A large context is
    # worth having: summarising a long page in one pass beats stitching together
    # summaries of its halves.
    LLM_WINDOW_CHARS: ${LLM_WINDOW_CHARS:-20000}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?set EMBEDDING_BASE_URL}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set EMBEDDING_API_KEY}
    EMBEDDING_DIM: ${EMBEDDING_DIM:?set EMBEDDING_DIM}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
    # Must match the embedding model's own context window, in characters.
    EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-24000}
    # Optional cross-encoder that reorders search results and picks the pages
    # the answering model reads. Leave RERANK_MODEL empty to switch it off.
    RERANK_MODEL: ${RERANK_MODEL:-}
    RERANK_BASE_URL: ${RERANK_BASE_URL:-}
    # One provider serves all three models here, so the reranker falls back to
    # the chat model's key rather than asking for the same secret twice.
    RERANK_API_KEY: ${RERANK_API_KEY:-${LLM_API_KEY}}
    # Bulk mail. Every address here has to be a verified SES identity: an
    # unverified sender fails every message in a campaign, one a second.
    MARKETING_FROM_ADDRESSES: ${MARKETING_FROM_ADDRESSES:-["shanaka@plusgpt.io","noreply@plusgpt.io"]}
    MARKETING_SEND_PER_TICK: ${MARKETING_SEND_PER_TICK:-1}
    # Optional speech to text, for dictating a note. Leave TRANSCRIPTION_MODEL
    # empty and the microphone is not offered at all. Audio is never stored.
    TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
    TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-}
    TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-${LLM_API_KEY}}
    # Both a cost control and the memory bound: the recording is held in memory
    # for one request rather than written anywhere.
    MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-120}
    MAX_AUDIO_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-20}
    # No document-parsing model here: page images go to the chat model instead.
    IMPORT_PARSER: ${IMPORT_PARSER:-llm}

    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-1}
    RRF_K: ${RRF_K:-60}
    VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.15}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
    MAX_IMPORT_SIZE_MB: ${MAX_IMPORT_SIZE_MB:-50}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      # Without this Qdrant serves every user's embeddings to anything that can
      # open a socket to it. It is not published to the host, but "only the
      # container network" is not the same as "only us".
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # quay.io is MinIO's own registry; the Docker Hub mirror now needs auth.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prestart:
    <<: *backend-common
    restart: "no"
    command: ["bash", "scripts/prestart.sh"]
    depends_on:
      db:
        condition: service_healthy

  # TLS terminator. Set SITE_DOMAINS to enable it; without a domain you can run
  # the stack with `--scale caddy=0` and publish the backend port instead.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAINS: ${SITE_DOMAINS:?set SITE_DOMAINS}
      # The same names with an http:// scheme, e.g. "http://a.com, http://www.a.com"
      SITE_DOMAINS_HTTP: ${SITE_DOMAINS_HTTP:?set SITE_DOMAINS_HTTP}
      ACME_EMAIL: ${ACME_EMAIL:-}
      SERVER_IP: ${SERVER_IP:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates and account keys survive restarts
      - caddy-config:/config
    depends_on:
      - backend
      - mcp

  # MCP server: the same knowledge base, exposed to agents at /mcp. It holds no
  # credentials; callers authenticate with their own API key.
  mcp:
    image: shanaka95/knowledgebase-mcp:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      KB_API_URL: http://backend:8000/api/v1
      PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *backend-common
    # Not published: Caddy reaches it on the Docker network.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app-db-data:
  qdrant-data:
  minio-data:
  caddy-data:
  caddy-config:
