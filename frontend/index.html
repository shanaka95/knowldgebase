<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlusGPT</title>
    <meta
      name="description"
      content="PlusGPT is a personal knowledge management system: write, organise and search your own pages, and ask questions answered from them."
    />
    <meta name="theme-color" content="#6366F1" />

    <!-- SVG first for sharp rendering at any size; the .ico is the fallback for

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="PlusGPT" />
    <meta
      property="og:description"
      content="A personal knowledge management system."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
