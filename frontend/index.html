<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager. High in the head because that is where the
         container has to load to see the first page view; the tag itself is
         async, so it does not hold up anything below it. This is the only HTML
         document the app has - every route is the same shell - so one copy
         covers every page.

         Verbatim, and this file is excluded from the formatter in biome.json
         to keep it that way: `bun run lint` runs with --unsafe and rewrote
         Google's snippet into arrow functions and template literals, which
         works but makes it impossible to diff against what Google publishes. -->
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PF2P5NDT');</script>
    <!-- End Google Tag Manager -->

    <title>PlusGPT</title>
    <meta
      name="description"
      content="PlusGPT is a personal knowledge management system: write, organise and search your own pages, and ask questions answered from them."
    />
    <meta name="theme-color" content="#6366F1" />

    <!-- SVG first for sharp rendering at any size; the .ico is the fallback for
         browsers that still want one, and carries the 16-48px raster sizes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="PlusGPT" />
    <meta
      property="og:description"
      content="A personal knowledge management system."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
